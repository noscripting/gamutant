<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Color 4, interpolating with missing components: color-mix() in hwb with a missing hue mixes off the spec</title>
<link rel="help" href="https://drafts.csswg.org/css-color-4/#interpolation-missing">
<meta name="assert" content="If any analogous components which are missing components are found, they will be carried forward and re-inserted in the converted color before premultiplication, and before linear interpolation takes place.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script src="/css/support/color-testcommon.js"></script>
<style>
  #target { color: color-mix(in hwb, oklch(0.7 0.15 none), oklch(0.5 0.1 250)); }
</style>
<div id="target"></div>
<script>
test(() => {
  const actual = getComputedStyle(document.getElementById('target')).getPropertyValue("color").trim();
  set_up_fuzzy_color_test()(actual, "color(srgb 0.321715 0.540977 0.75503)");
}, "color is color(srgb 0.321715 0.540977 0.75503)");
</script>
