<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Color 4, powerless components: color-mix() in oklch drops the hue of a low-chroma color whose hue isn't powerless</title>
<link rel="help" href="https://drafts.csswg.org/css-color-4/#powerless">
<meta name="assert" content="When performing color space conversion to a cylindrical polar color space, user agents shall treat a hue component as powerless if the chroma (or other measure of colorfulness, such as saturation in hsl) is less than or equal to the epsilon (ε) specified for that color space.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script src="/css/support/color-testcommon.js"></script>
<style>
  @property --c { syntax: '<color>'; inherits: false; initial-value: transparent; }
  #target { --c: color-mix(in oklch, rgb(145 135 138), oklch(0.6 0.1 200)); }
</style>
<div id="target"></div>
<script>
test(() => {
  const actual = getComputedStyle(document.getElementById('target')).getPropertyValue("--c").trim();
  set_up_fuzzy_color_test()(actual, "oklch(0.616561 0.056375 278.615933)");
}, "--c is oklch(0.616561 0.056375 278.615933)");
</script>
