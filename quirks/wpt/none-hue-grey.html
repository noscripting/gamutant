<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Color 4, missing components: A none hue converts as grey in a relative color</title>
<link rel="help" href="https://drafts.csswg.org/css-color-4/#missing">
<meta name="assert" content="For all other purposes, a missing component behaves as a zero value, in the appropriate unit for that component: 0, 0%, or 0deg. This includes rendering the color directly, converting it to another color space, performing computations on the color component values, etc.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script src="/css/support/color-testcommon.js"></script>
<style>
  @property --c { syntax: '<color>'; inherits: false; initial-value: transparent; }
  #target { --c: color(from oklch(0.6 0.3 none) srgb r g b); }
</style>
<div id="target"></div>
<script>
test(() => {
  const actual = getComputedStyle(document.getElementById('target')).getPropertyValue("--c").trim();
  set_up_fuzzy_color_test()(actual, "color(srgb 0.978129 -0.26354 0.474082)");
}, "--c is color(srgb 0.978129 -0.26354 0.474082)");
</script>
