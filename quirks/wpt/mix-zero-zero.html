<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Color 5, color-mix(): color-mix() whose percentages sum to 0% doesn't give the spec's color</title>
<link rel="help" href="https://drafts.csswg.org/css-color-5/#color-mix-result">
<meta name="assert" content="Interpolate a and b’s colors as described in CSS Color 4 § 13. Color Interpolation, with a progress percentage equal to (b’s percentage) / combined percentage), if combined percentage is greater than 0, and 0.5 otherwise.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script src="/css/support/color-testcommon.js"></script>
<style>
  #target { background-color: lime;
background-color: color-mix(in srgb, red 0%, blue 0%); }
</style>
<div id="target"></div>
<script>
test(() => {
  const actual = getComputedStyle(document.getElementById('target')).getPropertyValue("background-color").trim();
  set_up_fuzzy_color_test()(actual, "color(srgb 0.5 0 0.5 / 0)");
}, "background-color is color(srgb 0.5 0 0.5 / 0)");
</script>
