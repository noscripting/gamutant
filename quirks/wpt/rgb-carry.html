<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Color 4, analogous components: color-mix() in display-p3 doesn't carry a missing r from srgb</title>
<link rel="help" href="https://drafts.csswg.org/css-color-4/#analogous-components">
<meta name="assert" content="If any analogous components which are missing components are found, they will be carried forward and re-inserted in the converted color before premultiplication, and before linear interpolation takes place.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script src="/css/support/color-testcommon.js"></script>
<style>
  #target { color: color-mix(in display-p3, color(srgb none 0.5 0.2), color(display-p3 0.8 0.2 0.2)); }
</style>
<div id="target"></div>
<script>
test(() => {
  const actual = getComputedStyle(document.getElementById('target')).getPropertyValue("color").trim();
  set_up_fuzzy_color_test()(actual, "color(display-p3 0.8 0.346124 0.218251)");
}, "color is color(display-p3 0.8 0.346124 0.218251)");
</script>
